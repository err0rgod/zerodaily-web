<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join — ZeroDaily</title>
  <meta name="description" content="Join the ZeroDaily waitlist." />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#faf8f3" />

  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('zd-theme'); } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = stored ? (stored === 'dark') : prefersDark;
      if (dark) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.colorScheme = 'light';
      }
      var themeColor = dark ? '#0d0e12' : '#faf8f3';
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute('content', themeColor);
    })();
  </script>

  <style>
    :root {
      --bg: #faf8f3;
      --text: #1b1a17;
      --muted: #565349;
      --faint: #8a867b;
      --border: #cfcaba;
      --rule: #e2ded2;
    }

    html.dark {
      --bg: #0d0e12;
      --text: #e9e7e0;
      --muted: #a5a29a;
      --faint: #6d6b64;
      --border: #343945;
      --rule: #262a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.5;
    }

    a { color: inherit; }

    header {
      border-bottom: 1px solid var(--rule);
    }

    .wrap {
      max-width: 42rem;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem 1.5rem;
    }

    .brand {
      font-weight: 500;
      text-decoration: none;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1rem;
      font-size: 0.875rem;
      color: var(--muted);
    }

    nav a { text-decoration: none; }
    nav a:hover, #theme-toggle:hover { color: var(--text); }

    #theme-toggle {
      background: none;
      border: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    main.wrap { padding-top: 3rem; padding-bottom: 4rem; }

    h1, h2 {
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      font-weight: 400;
      line-height: 1.2;
      margin: 0;
    }

    h1 { font-size: 2rem; }
    h2 { font-size: 1.5rem; }

    .lede {
      margin: 0.75rem 0 0;
      color: var(--muted);
    }

    form { margin-top: 1.5rem; }

    label {
      font-size: 0.875rem;
      color: var(--muted);
    }

    input[type="email"] {
      display: block;
      width: 100%;
      max-width: 24rem;
      margin-top: 0.35rem;
      padding: 0.45rem 0.6rem;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid var(--border);
    }

    input:focus {
      outline: 2px solid #c2410c;
      outline-offset: 1px;
    }

    button[type="submit"] {
      margin-top: 0.75rem;
      min-width: 4.5rem;
      padding: 0.45rem 0.8rem;
      font: inherit;
      font-size: 0.95rem;
      background: var(--text);
      color: var(--bg);
      border: 0;
      cursor: pointer;
    }

    button[type="submit"]:hover { background: #c2410c; color: #fff; }
    html.dark button[type="submit"]:hover { background: #f26f3f; color: #181410; }
    button[type="submit"]:disabled { opacity: 0.6; cursor: default; }

    .msg {
      min-height: 1.25rem;
      margin-top: 0.75rem;
      font-size: 0.95rem;
    }

    .msg.error { color: #b91c1c; }
    html.dark .msg.error { color: #f87171; }

    .welcome-text {
      margin: 0.75rem 0 0;
      max-width: 28rem;
      color: var(--muted);
    }

    .welcome-text a { text-underline-offset: 2px; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="wrap bar">
      <a class="brand" href="/">ZeroDaily</a>
      <nav>
        <a href="/wire">Wire</a>
        <a href="/join" aria-current="page" style="color: inherit; text-decoration: underline; text-underline-offset: 4px;">Waitlist</a>
        <a href="/apk">Download</a>
        <button id="theme-toggle" type="button">Dark</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1 id="main-title">join Zerodaily</h1>

    <div id="step-email">
      <p class="lede">An email when there's something worth sending.</p>
      <form id="form-email" autocomplete="off">
        <label for="email-input">Email</label>
        <input
          type="email"
          id="email-input"
          name="email"
          placeholder="you@domain.com"
          required
          autofocus
          spellcheck="false"
        />
        <button type="submit" id="btn-submit">
          <span class="btn-text">Join</span>
          <span class="spinner hidden" id="spinner"></span>
        </button>
      </form>
      <div class="msg" id="msg"></div>
    </div>

    <div id="step-joined" class="hidden">
      <h2 class="welcome-heading">welcome to zerodaily</h2>
      <p class="welcome-text">
        we will inform you when we launch till then you can visit our <a href="/">website</a> and try our app by <a href="/download/apk">.apk</a>
      </p>
    </div>
  </main>

  <footer>
    <div class="wrap" style="padding-top: 2rem; padding-bottom: 2rem; border-top: 1px solid var(--rule); color: var(--faint); font-size: 0.875rem;">
      <p style="margin: 0;">&copy; <span id="year">2026</span> ZeroDaily</p>
      <p style="margin: 0.5rem 0 0;">
        <a href="/wire">Wire</a> ·
        <a href="/join">Waitlist</a> ·
        <a href="/privacy">Privacy</a> ·
        <a href="/terms">Terms</a> ·
        <a href="/delete-account">Delete account</a> ·
        <a href="https://github.com/err0rgod/zerodaily-app">GitHub</a>
      </p>
    </div>
  </footer>

  <script>
    (function () {
      const yearEl = document.getElementById('year');
      if (yearEl) yearEl.textContent = String(new Date().getFullYear());

      const themeBtn = document.getElementById('theme-toggle');
      function syncThemeBtn() {
        const dark = document.documentElement.classList.contains('dark');
        themeBtn.textContent = dark ? 'Light' : 'Dark';
        themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
      }
      syncThemeBtn();
      themeBtn.addEventListener('click', function () {
        const nowDark = !document.documentElement.classList.contains('dark');
        document.documentElement.classList.toggle('dark', nowDark);
        document.documentElement.style.colorScheme = nowDark ? 'dark' : 'light';
        try { localStorage.setItem('zd-theme', nowDark ? 'dark' : 'light'); } catch (e) {}
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', nowDark ? '#0d0e12' : '#faf8f3');
        syncThemeBtn();
      });

      const mainTitle = document.getElementById('main-title');
      const stepEmail = document.getElementById('step-email');
      const stepJoined = document.getElementById('step-joined');
      const formEmail = document.getElementById('form-email');
      const emailInput = document.getElementById('email-input');
      const btnSubmit = document.getElementById('btn-submit');
      const spinner = document.getElementById('spinner');
      const msg = document.getElementById('msg');

      const API_HOSTS = [
        '/api/join',
        'https://api.zerodaily.in/api/v1/join',
        'https://gnur4xlnhnucw6kghv4lqx4cly0uioia.lambda-url.us-east-1.on.aws/api/v1/join',
        'https://urpkmq2bzf.execute-api.us-east-1.amazonaws.com/api/v1/join'
      ];

      async function apiSave(email) {
        let lastError = null;
        for (const host of API_HOSTS) {
          try {
            const url = `${host}/save`;
            const res = await fetch(url, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({ email: email })
            });

            const data = await res.json().catch(() => null);

            if (res.ok) {
              return data || { status: 'success' };
            } else {
              const errMsg = (data && (data.detail || data.message)) || 'Request failed';
              if (res.status === 400) throw new Error(errMsg);
              lastError = new Error(errMsg);
            }
          } catch (err) {
            lastError = err;
            if (err.message && !err.message.includes('fetch') && !err.message.includes('Failed to fetch')) {
              throw err;
            }
          }
        }
        throw lastError || new Error('Unable to connect to service');
      }

      function showMsg(text) {
        msg.textContent = text;
        msg.className = 'msg error';
      }

      formEmail.addEventListener('submit', async function (e) {
        e.preventDefault();
        msg.textContent = '';
        msg.className = 'msg';

        const email = emailInput.value.trim().toLowerCase();
        if (!email) return;

        btnSubmit.disabled = true;
        btnSubmit.querySelector('.btn-text').classList.add('hidden');
        spinner.classList.remove('hidden');

        try {
          await apiSave(email);
          if (mainTitle) mainTitle.classList.add('hidden');
          stepEmail.classList.add('hidden');
          stepJoined.classList.remove('hidden');
        } catch (err) {
          showMsg(err.message || 'Error submitting email');
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.querySelector('.btn-text').classList.remove('hidden');
          spinner.classList.add('hidden');
        }
      });
    })();
  </script>
</body>
</html>
