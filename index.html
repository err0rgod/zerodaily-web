<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroDaily — Tech news, roasted in 60 words</title>
  <meta name="description" content="ZeroDaily reads the tech press so you don't have to. One 60-word, no-spin briefing per story across cybersecurity, AI, software, defense, silicon and finance." />

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://zerodaily.in" />
  <meta property="og:site_name" content="ZeroDaily" />
  <meta property="og:title" content="ZeroDaily — Tech news, roasted in 60 words" />
  <meta property="og:description" content="One 60-word, no-spin briefing per story. We read the tech press so you don't have to." />
  <meta property="og:image" content="https://zerodaily.in/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ZeroDaily — Tech news, roasted in 60 words" />
  <meta name="twitter:description" content="One 60-word, no-spin briefing per story across 7 tech & market domains." />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Fonts: Newsreader (serif headlines) + Inter (UI) + JetBrains Mono (labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet" />

  <script>
    // Set theme before first paint to avoid a flash of the wrong mode.
    // ZeroDaily is a newspaper — paper (light) is the house style; dark is opt-in.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('zd-theme'); } catch (e) {}
      var dark = stored === 'dark';
      if (dark) document.documentElement.classList.add('dark');
      document.querySelector('meta[name="theme-color"]') ||
        document.head.appendChild(Object.assign(document.createElement('meta'), { name: 'theme-color' }));
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0d0e12' : '#faf8f3');
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
