<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroDaily — Editorial Tech & Market Intelligence</title>
  <meta name="description" content="ZeroDaily roasts the tech industry with cynical, high-signal 60-word summaries across Cybersecurity, AI, Software Engineering, Defense, Silicon, and Finance." />
  
  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://zerodaily.in" />
  <meta property="og:title" content="ZeroDaily — Editorial Tech & Market Intelligence" />
  <meta property="og:description" content="No corporate PR spin. We roast the facts in 60 words across 7 critical tech & market domains." />
  <meta property="og:image" content="https://zerodaily.in/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#08090d" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <!-- Fonts: Newsreader (Editorial Serif) + Inter (Sans) + JetBrains Mono (Code/Tabular) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            surface: {
              base: '#08090d',
              raised: '#0e1117',
              card: '#131720',
              cardHover: '#181e2b',
              border: '#1d2330',
              borderLight: '#2c364a',
            },
            accent: {
              emerald: '#10b981',
              cyan: '#06b6d4',
              amber: '#f59e0b',
              rose: '#f43f5e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#08090d] text-slate-200 font-sans min-h-screen selection:bg-emerald-500 selection:text-black antialiased">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
