<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroDaily — Tech news, roasted in 60 words</title>
  <meta name="description" content="ZeroDaily reads the tech press so you don't have to. One 60-word, no-spin briefing per story across cybersecurity, AI, software, defense, silicon and finance." />

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://zerodaily.in" />
  <meta property="og:site_name" content="ZeroDaily" />
  <meta property="og:title" content="ZeroDaily — Tech news, roasted in 60 words" />
  <meta property="og:description" content="Download ZeroDaily for fastest tech news — 60-word, no-spin briefings across tech, AI, cyber, and silicon." />
  <meta property="og:image" content="https://zerodaily.in/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ZeroDaily — Tech news, roasted in 60 words" />
  <meta name="twitter:description" content="Download ZeroDaily for fastest tech news — 60-word, no-spin briefings across tech, AI, cyber, and silicon." />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Fonts: Newsreader (serif headlines) + Inter (UI) + JetBrains Mono (labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet" />

  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#faf8f3" />

  <script>
    // Set theme before first paint to avoid a flash of the wrong mode.
    // Respects user-saved preference, or falls back to system color scheme.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('zd-theme'); } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = stored ? (stored === 'dark') : prefersDark;
      if (dark) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.colorScheme = 'light';
      }
      var themeColor = dark ? '#0d0e12' : '#faf8f3';
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute('content', themeColor);

      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
          try {
            if (localStorage.getItem('zd-theme')) return;
          } catch (err) {}
          var systemDark = e.matches;
          document.documentElement.classList.toggle('dark', systemDark);
          document.documentElement.style.colorScheme = systemDark ? 'dark' : 'light';
          var mTheme = document.querySelector('meta[name="theme-color"]');
          if (mTheme) mTheme.setAttribute('content', systemDark ? '#0d0e12' : '#faf8f3');
          var moon = document.getElementById('theme-icon-moon');
          var sun = document.getElementById('theme-icon-sun');
          if (moon && sun) {
            moon.classList.toggle('hidden', systemDark);
            sun.classList.toggle('hidden', !systemDark);
          }
          var toggleBtn = document.getElementById('theme-toggle');
          if (toggleBtn) {
            toggleBtn.setAttribute('aria-label', systemDark ? 'Switch to light theme' : 'Switch to dark theme');
          }
        });
      }
    })();
  </script>
</head>
<body class="bg-paper text-ink dark:bg-night dark:text-paper-ink min-h-screen">
  <div id="app" class="min-h-screen bg-paper dark:bg-night"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
